services:
  postgres:
    image: postgres:16-alpine
    container_name: maf-workshop-db
    environment:
      POSTGRES_USER: maf
      POSTGRES_PASSWORD: maf
      POSTGRES_DB: workshop
    ports:
      - "5432:5432"
    volumes:
      # Scripts em /docker-entrypoint-initdb.d rodam na ordem alfabética
      # na PRIMEIRA subida do volume (01_schema -> 02_seed).
      - ./sql:/docker-entrypoint-initdb.d:ro
      - maf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maf -d workshop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maf_pgdata:
